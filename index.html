const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const MINISTRY = 'ក្រសួង អប់រំ យុវជន និង កីឡា';
const INNER = ['ប្រជុំការងារផ្សេងៗ','ប្រជុំក្រុមបច្ចេកទេស','សម្រង់អត្ថបទ','កម្មវិធីសិក្សា','ជួយសិស្សរៀនយឺត','សម្រង់ពិន្ទុ','សម្រង់អវត្តមានសិស្ស','កិច្ចព្រមព្រៀងការងារ','ផែនការមុខវិជ្ជា','ផែនការសិស្ស','ផែនការបន្ទុកថ្នាក់','ក្រុមប្រឹក្សាថ្នាក់'];

/* ---------- roster parsing ---------- */
//<parser>
const KHD = '០១២៣៤៥៦៧៨៩';
const CLS = /^[0-9០-៩]{1,2}\s*[A-Za-z]{0,2}$/;
const normCls = c => String(c).replace(/\s+/g,'').replace(/[០-៩]/g, d => KHD.indexOf(d)).toUpperCase();
function normSex(x){
  x = (x||'').trim(); if(!x) return '';
  if (/^(ប្រុស|ប|m|male|boy)$/i.test(x)) return 'ប';
  if (/^(ស្រី|ស|f|female|girl)$/i.test(x)) return 'ស';
  return x;
}
function parseDelimited(text, d){
  const rows=[]; let row=[], cell='', q=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if (c==='"' && cell==='') q=true;
    else if (c===d){ row.push(cell); cell=''; }
    else if (c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else if (c==='\r'){}
    else cell+=c;
  }
  row.push(cell); rows.push(row);
  return rows.map(r=>r.map(x=>x.trim())).filter(r=>r.some(x=>x));
}
function parseRoster(text, fb){
  const d = text.includes('\t') ? '\t' : ',';
  const rows = parseDelimited(text, d);
  const out = {}; let total = 0;
  const add = (c, n, sx) => {
    n = String(n||'').replace(/^\s*[0-9០-៩]+\s*[\.\)]\s*/,'').trim();
    if (!n || /^[0-9០-៩]+$/.test(n)) return;
    (out[c] = out[c] || []).push({name:n, sex:normSex(sx)}); total++;
  };
  if (!rows.length) return {byClass:out,total:0};
  // layout 1: one column per class (class name in the first row)
  const cand = [];
  rows[0].forEach((x,j) => { if (CLS.test(x)) cand.push(j); });
  const isMatrix = cand.length && cand.every(j => rows.slice(1).filter(r => CLS.test(r[j]||'')).length <= Math.max(1, rows.length*0.2));
  if (isMatrix){
    cand.forEach(j => {
      const c = normCls(rows[0][j]);
      const sexCol = /ភេទ/.test(rows[0][j+1]||'') ? j+1 : -1;
      rows.slice(1).forEach(r => add(c, r[j], sexCol>=0 ? r[sexCol] : ''));
    });
    return {byClass:out,total};
  }
  // layout 2: header row with separate "name" / "class" / "sex" columns
  const hi = rows.slice(0,6).findIndex(r => r.some(x => /ឈ្មោះ|គោត្តនាម|នាម/.test(x) && !/ថ្នាក់/.test(x)) || r.some(x => /^ថ្នាក់$/.test(x)));
  if (hi >= 0){
    const h = rows[hi];
    const iName = h.findIndex(x => /ឈ្មោះ|គោត្តនាម|នាម/.test(x) && !/ថ្នាក់/.test(x));
    const iCls = h.findIndex(x => /ថ្នាក់/.test(x) && !/ឈ្មោះ/.test(x));
    const iSex = h.findIndex(x => /ភេទ/.test(x));
    if (iName >= 0){
      rows.slice(hi+1).forEach(r => {
        const c = iCls>=0 && r[iCls] ? normCls(r[iCls]) : fb;
        add(c, r[iName], iSex>=0 ? r[iSex] : '');
      });
      return {byClass:out,total};
    }
  }
  // layout 3: no header
  rows.forEach(r => {
    let cells = r.filter(x => x !== '');
    if (cells.length >= 2 && /^[0-9០-៩]+$/.test(cells[0])) cells = cells.slice(1);
    if (!cells.length) return;
    if (cells.length >= 2 && CLS.test(cells[0])) add(normCls(cells[0]), cells[1], cells[2]);
    else if (cells.length >= 2 && CLS.test(cells[1])) add(normCls(cells[1]), cells[0], cells[2]);
    else add(fb, cells[0], cells[1]);
  });
  return {byClass:out,total};
}
function sortClasses(a){
  return [...new Set(a)].sort((x,y)=>{const nx=parseInt(x)||0, ny=parseInt(y)||0; return nx-ny || String(x).localeCompare(String(y));});
}
//</parser>

function fitAll(root){
  root.querySelectorAll('.fit').forEach(function(el){
    el.style.fontSize='';
    var fs=parseFloat(getComputedStyle(el).fontSize), box=el.clientWidth, n=0;
    while(el.scrollWidth>box+1 && fs>7 && n++<90){ fs-=0.5; el.style.fontSize=fs+'px'; }
  });
}

function students(c){ return S.students[c] || []; }
function chunkRows(total, n1, n2){
  const need = total > 0 ? total : 30, pages = [];
  let i = 0, cap = n1;
  while (i < need){ pages.push([i, Math.min(i + cap, need)]); i += cap; cap = n2; }
  return pages;
}
function rosterTable(cls, head, nCols, n1, n2, title, rowH){
  const list = students(cls);
  return chunkRows(list.length, n1, n2).map((rg, pi) => {
    let body = '';
    for (let i = rg[0]; i < rg[1]; i++){
      const st = list[i];
      body += `<tr style="height:${rowH}mm"><td>${i+1}</td><td class="l">${st?esc(st.name):''}</td><td>${st?esc(st.sex):''}</td>${'<td></td>'.repeat(nCols)}</tr>`;
    }
    return `<section class="sheet"><div class="pg">${pi===0?`<div class="ttl">${esc(title)} ថ្នាក់ទី ${esc(cls)}</div>`:'<div style="height:6mm"></div>'}<table class="t">${head}<tbody>${body}</tbody></table></div></section>`;
  });
}

function layoutPreview(){
  const pv = $('#pv'); if (!pv) return;
  fitAll(pv);
  const avail = pv.clientWidth - 28;
  pv.querySelectorAll('.pvbox').forEach(box => {
    const sh = box.firstElementChild;
    const w = sh.offsetWidth, h = sh.offsetHeight;
    const sc = Math.min(1, avail / w);
    sh.style.transformOrigin = '0 0';
    sh.style.transform = `scale(${sc})`;
    box.style.width = (w*sc) + 'px'; box.style.height = (h*sc) + 'px';
  });
}

/* ---------- PDF ---------- */
let pdfBusy = false;
function libsOk(zip){ return !!(window.html2canvas && window.jspdf && window.jspdf.jsPDF && (!zip || window.JSZip)); }
async function pdfFromResult(r, onPage){
  const host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-20000px;top:0;width:300mm;background:#fff;';
  host.innerHTML = '<style>' + DOC_CSS + '</style>' + r.pages.join('');
  document.body.appendChild(host);
  try{
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    fitAll(host);
    const sheets = [...host.querySelectorAll('.sheet')];
    const pw = r.land ? 297 : 210, ph = r.land ? 210 : 297;
    const pdf = new window.jspdf.jsPDF({orientation: r.land ? 'landscape' : 'portrait', unit:'mm', format:'a4', compress:true});
    for (let i = 0; i < sheets.length; i++){
      if (onPage) onPage(i + 1, sheets.length);
      const cv = await window.html2canvas(sheets[i], {scale:2, backgroundColor:'#ffffff', useCORS:true, logging:false});
      if (i) pdf.addPage('a4', r.land ? 'landscape' : 'portrait');
      pdf.addImage(cv.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, pw, ph, undefined, 'FAST');
      cv.width = cv.height = 0;
    }
    return pdf.output('arraybuffer');
  } finally { host.remove(); }
}
async function makePdf(btn){
  if (pdfBusy) return;
  const r = pagesFor(S.ui.tab);
  if (r.empty || !r.pages.length){ toast('សូមជ្រើសថ្នាក់នៅផ្នែក «ការកំណត់» សិន។'); return; }
  if (!libsOk()){ toast('មិនអាចផ្ទុកឧបករណ៍បង្កើត PDF បានទេ។ ពិនិត្យអ៊ីនធឺណិត រួចព្យាយាមម្តងទៀត។'); return; }
  pdfBusy = true; const label = btn.textContent; btn.disabled = true;
  try{
    const buf = await pdfFromResult(r, (i, n) => { btn.textContent = 'កំពុងបង្កើត ' + i + '/' + n + '…'; });
    await saveFile(r.file.replace(/\.html$/, '.pdf'), buf);
  }catch(e){ toast('បង្កើត PDF មិនបាន។ សាកល្បងម្តងទៀត។'); }
  finally{ btn.textContent = label; btn.disabled = false; pdfBusy = false; }
}

/* ---------- ZIP of everything ---------- */
const safeName = s => String(s).replace(/[\\/:*?"<>|]+/g, '-').trim();
function withUi(patch, fn){
  const old = {kind:S.ui.kind, cls:S.ui.cls, inner:S.ui.inner, innerCls:S.ui.innerCls};
  Object.assign(S.ui, patch);
  try{ return fn(); } finally { Object.assign(S.ui, old); }
}
function zipJobs(sel){
  const jobs = [], cl = classes();
  if (sel.cover) jobs.push({path:'១-ក្របមុខ/ក្របមុខ.pdf', get:() => pagesFor('cover')});
  if (sel.inner) INNER.forEach((t, i) => {
    const per = SINGLE.has(t) && cl.length ? cl : [null];
    per.forEach(c => jobs.push({path:'២-ក្របខាងក្នុង/' + (i+1) + '-' + safeName(t) + (c ? ' ' + safeName(c) : '') + '.pdf', get:() => withUi({inner:t, innerCls:c || S.ui.innerCls}, () => pagesFor('inner'))}));
  });
  if (sel.print){
    ['meeting','tech'].forEach(k => jobs.push({path:'៣-ឯកសារព្រីន/' + safeName(KINDS[k].label) + '.pdf', get:() => withUi({kind:k}, () => pagesFor('print'))}));
    ['extract','absence','scores','slow'].forEach(k => cl.forEach(c => jobs.push({path:'៣-ឯកសារព្រីន/ថ្នាក់ ' + safeName(c) + '/' + safeName(KINDS[k].label) + ' ' + safeName(c) + '.pdf', get:() => withUi({kind:k, cls:c}, () => pagesFor('print'))})));
  }
  return jobs;
}
const ZSEL = {cover:true, inner:true, print:true};
async function makeZip(btn){
  if (pdfBusy) return;
  if (!libsOk(true)){ toast('មិនអាចផ្ទុកឧបករណ៍បង្កើត PDF/ZIP បានទេ។ ពិនិត្យអ៊ីនធឺណិត។'); return; }
  const jobs = zipJobs(ZSEL);
  if (!jobs.length){ toast('សូមជ្រើសយ៉ាងហោចណាស់មួយផ្នែក។'); return; }
  pdfBusy = true; btn.disabled = true;
  const bar = $('#zprog'), label = btn.textContent;
  try{
    const zip = new window.JSZip(); let done = 0;
    for (const job of jobs){
      const r = job.get();
      if (!r.pages.length) { done++; continue; }
      const buf = await pdfFromResult(r, (i, n) => { bar.textContent = 'ឯកសារ ' + (done+1) + '/' + jobs.length + ' · ទំព័រ ' + i + '/' + n + ' · ' + job.path.split('/').pop(); });
      zip.file(job.path, buf); done++;
    }
    bar.textContent = 'កំពុងបង្ហាប់ ZIP…';
    const blob = await zip.generateAsync({type:'blob', compression:'STORE'});
    const d = new Date(), pad = n => String(n).padStart(2, '0');
    await saveFile('radthabal-' + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + '.zip', blob);
    bar.textContent = 'បានបង្កើត ' + done + ' ឯកសារ PDF ក្នុង ZIP។';
  }catch(e){ bar.textContent = 'បង្កើត ZIP មិនបាន។ សាកល្បងម្តងទៀត។'; }
  finally{ btn.disabled = false; btn.textContent = label; pdfBusy = false; }
}
function renderAll(){

let DL = null;
async function initDownloads(){
  try{ if (window.claude && window.claude.use) DL = await window.claude.use('downloads'); }catch(e){ DL = null; }
  document.body.classList.toggle('nodl', !DL);
}
async function saveFile(filename, data){
  if (!DL){
    // outside claude.ai: normal browser download
    try{
      const blob = data instanceof Blob ? data : new Blob([data], {type: /\.pdf$/.test(filename) ? 'application/pdf' : /\.zip$/.test(filename) ? 'application/zip' : 'application/octet-stream'});
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      toast('កំពុងទាញយក៖ ' + filename);
    }catch(e){ toast('រក្សាទុកមិនបាន។'); }
    return;
  }
  try{ await DL.save({filename, data}); toast('បានរក្សាទុក៖ ' + filename); }
  catch(e){ if (e && e.code === 'declined') return; toast('រក្សាទុកមិនបាន (' + ((e && e.code) || 'error') + ')'); }
}

}

function errText(e){
  const c = e && e.code;
  if (c === 'sheet_private') return 'អានមិនបាន។ ត្រូវចែករំលែក Google Sheet ជា «អ្នកដែលមានតំណអាចមើលបាន» (Anyone with the link: Viewer)។';
  if (e && e.name === 'TypeError') return 'ទាញមិនបាន។ ពិនិត្យអ៊ីនធឺណិត និងថា Google Sheet ត្រូវបានចែករំលែកជា «អ្នកដែលមានតំណអាចមើលបាន»។';
  if (c === 'needs_reauth') return 'ត្រូវភ្ជាប់ Google Sheets ឡើងវិញ៖ claude.ai → Settings → Connectors។';
  if (c === 'server_not_connected') return 'មិនទាន់ភ្ជាប់ Google Sheets។ បន្ថែមនៅ claude.ai → Settings → Connectors។';
  if (c === 'selection_required') return 'មាន connector Google Sheets ច្រើន។ សូមជ្រើសមួយ ហើយព្យាយាមម្តងទៀត។';
  if (c === 'approval_required' || c === 'not_in_manifest' || c === 'consent_required') return 'ត្រូវការការអនុញ្ញាត។ ចុចប៊ូតុងទាញម្តងទៀត ហើយជ្រើស Allow។';
  if (c === 'blocked_by_policy') return 'អង្គការរបស់អ្នកបានហាមប្រាមការប្រើ connector នេះ។';
  if (c === 'tool_error') return 'Google Sheets រាយការណ៍កំហុស៖ ' + String((e && e.message) || '').slice(0, 140);
  if (c === 'server_unavailable' || c === 'rate_limited' || c === 'upstream_error') return 'Google Sheets មិនឆ្លើយតបឥឡូវនេះ។ ព្យាយាមម្តងទៀតបន្តិចទៀត។';

  return 'ទាញមិនបាន (' + (c || 'error') + ')។';
}
const HEADERS = new Set(['ថ្នាក់','Class','ឈ្មោះ','ឈ្មោះសិស្ស','លរ','ល.រ']);
async function getRowsCsv(range){
  // outside claude.ai: read the sheet's public CSV export (sheet must be shared "anyone with the link can view")
  const m = /^'(.+)'!/.exec(range); const tab = m ? m[1] : '';
  const url = 'https://docs.google.com/spreadsheets/d/' + sheetId() + '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent(tab);
  const res = await fetch(url);
  if (!res.ok){ const e = new Error('http ' + res.status); e.code = 'sheet_private'; throw e; }
  const text = await res.text();
  if (/^\s*</.test(text)){ const e = new Error('html'); e.code = 'sheet_private'; throw e; }
  const rows = parseDelimited(text, ',');
  if (rows.length && HEADERS.has(zw(rows[0][0]).trim()) || rows.length && HEADERS.has(zw(rows[0][1] || '').trim())) rows.shift();
  return rows;
}
async function getRows(range){
  if (!MCP) return getRowsCsv(range);
  const r = await MCP.callTool(SHEETSRV, 'get_values', {spreadsheetId: sheetId(), range}, {cache:false});
  let p = r.payload;
  if (typeof p === 'string'){ try{ p = JSON.parse(p); }catch(e){ p = null; } }
  return (p && (p.values || (p.valueRange && p.valueRange.values))) || [];
}
async function syncSheet(){
  if (syncing) return;
  if (!sheetId()){ setSync('តំណ Google Sheet មិនត្រឹមត្រូវ។ ពិនិត្យនៅផ្នែក «ការកំណត់»។', true); return; }
  syncing = true; setSync('កំពុងទាញពី Google Sheet…', false);
  try{
    const cls = await getRows(`'${TAB.classes}'!A2:A400`);
    const [tea, stu] = await Promise.all([getRows(`'${TAB.teachers}'!A2:C600`), getRows(`'${TAB.students}'!A2:D5000`)]);
    const by = {}; let n = 0;
    stu.forEach(r => {
      const name = cleanName(r[1]), c = normCls(zw(r[3] || ''));
      if (!name || !c) return;
      (by[c] = by[c] || []).push({name, sex: normSex(zw(r[2]))}); n++;
    });
    const teachers = tea.map(r => ({name: cleanName(r[0]), subject: cleanName(r[1]), phone: fixPhone(r[2])})).filter(t => t.name);
    const list = sortClasses(cls.map(r => normCls(zw(r[0] || ''))).filter(Boolean));
    S.sheet = {classes: list.length ? list : sortClasses(Object.keys(by)), teachers, at: Date.now()};
    Object.keys(by).forEach(c => { S.students[c] = by[c]; });
    const cur = teachers.find(t => keyName(t.name) === keyName(S.s.teacher));
    if (cur){ S.s.teacher = cur.name; if (cur.subject) S.s.subject = cur.subject; if (cur.phone) S.s.phone = cur.phone; }
    save();
    syncing = false;
    setSync('បានទាញ ' + n + ' សិស្ស, ' + teachers.length + ' គ្រូ, ' + S.sheet.classes.length + ' ថ្នាក់ ពី Google Sheet។', false);
    RENDER[S.ui.tab]();
  }catch(e){
    syncing = false; setSync(errText(e), true);
  }
}

  const rost = cl.length ? cl.map(c => {
    const l = students(c);
    return `<div class="rost"><header><span>ថ្នាក់ ${esc(c)} · ${l.length} នាក់</span></header>${l.length ? `<ol>${l.map(s => `<li>${esc(s.name)}${s.sex ? `<span>${esc(s.sex)}</span>` : ''}</li>`).join('')}</ol>` : '<p>មិនមានឈ្មោះសិស្សសម្រាប់ថ្នាក់នេះ</p>'}</div>`;
  }).join('') : '<p class="help">សូមជ្រើសថ្នាក់នៅផ្នែក «ការកំណត់» សិន។</p>';
  $('#app').innerHTML = `<div class="card"><h2>សិស្សតាមថ្នាក់ដែលបានជ្រើស</h2>
<p class="help" style="margin-top:0">ទាញពី Google Sheet ស្វ័យប្រវត្តិ។ ${S.sheet.at ? 'ចុងក្រោយ៖ ' + esc(fmtTime(S.sheet.at)) + '។' : 'មិនទាន់បានទាញ។ ចុចប៊ូតុងខាងលើ។'} ប្តូរថ្នាក់នៅផ្នែក «ការកំណត់»។</p>
<div class="roster">${rost}</div></div>
<details class="card" style="margin-top:16px"><summary style="cursor:pointer;font-weight:700">បិទភ្ជាប់ឈ្មោះដោយដៃ (បម្រុង)</summary>
<div style="margin-top:12px">
<div class="field"><label for="target">ថ្នាក់ (ប្រើពេលទិន្នន័យគ្មានជួរ «ថ្នាក់»)</label><select id="target" data-ui="target">${cl.map(c => `<option ${c === S.ui.target ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
<div class="field"><label for="paste">ទិន្នន័យចម្លងពី Sheet</label><textarea id="paste" placeholder="ល.រ&#9;ឈ្មោះ&#9;ភេទ&#9;ថ្នាក់"></textarea></div>
<div class="inline"><button class="btn pri" data-act="import-paste">នាំចូល</button><input type="file" id="csvFile" accept=".csv,.tsv,.txt,text/csv,text/plain" hidden><button class="btn" data-act="csv">ឬជ្រើសឯកសារ CSV</button></div>
<div id="impmsg" class="msg" role="status"></div></div></details>`;
}
function renderCover(){
  $('#app').innerHTML = `<div class="split"><div class="card"><h2>ក្របមុខ</h2>
<p class="help" style="margin-top:0">ព័ត៌មានទាញពីផ្នែក «ការកំណត់»។ ប្តូរនៅទីនោះ ការមើលជាមុនធ្វើបច្ចុប្បន្នភាពភ្លាមៗ។</p>
<div class="inline" style="margin-top:12px"><button class="btn pri" data-act="pdf" id="pdfbtn">Save as PDF</button></div>
<p class="help" id="logonote" hidden>ឡូហ្គោក្រសួងមិនទាន់មានទេ។ បន្ថែមនៅផ្នែក «ការកំណត់»។</p>
<p class="help">ចុច «Save as PDF» ដើម្បីរក្សាទុកជាឯកសារ .pdf រួចព្យាយាមព្រីនពី PDF នោះ។</p></div>
<div><div class="pvhead"><h2>មើលជាមុន (A4)</h2></div><div class="pv" id="pv"></div></div></div>`;
  updatePreview();
}
function renderInner(){
  $('#app').innerHTML = `<div class="split"><div class="card"><h2>ក្របខាងក្នុង</h2>
<div class="field"><label for="innerSel">ជ្រើសប្រភេទ</label><select id="innerSel" data-ui="inner">${INNER.map(t=>`<option ${t===S.ui.inner?'selected':''}>${t}</option>`).join('')}<option value="__all" ${S.ui.inner==='__all'?'selected':''}>ទាំងអស់ (${INNER.length} ទំព័រ)</option></select></div>
${(SINGLE.has(S.ui.inner) || S.ui.inner === '__all') ? `<div class="field"><label for="innerClsSel">ថ្នាក់ទី (សម្រាប់ផែនការសិស្ស ផែនការបន្ទុកថ្នាក់ ក្រុមប្រឹក្សាថ្នាក់)</label><select id="innerClsSel" data-ui="innerCls">${classes().map(c=>`<option ${c===innerCls()?'selected':''}>${esc(c)}</option>`).join('')}</select></div>` : ''}
<div class="inline"><button class="btn pri" data-act="pdf" id="pdfbtn">Save as PDF</button></div>
<p class="help" id="logonote" hidden>ឡូហ្គោក្រសួងមិនទាន់មានទេ។ បន្ថែមនៅផ្នែក «ការកំណត់»។</p></div>
<div><div class="pvhead"><h2>មើលជាមុន (A4)</h2></div><div class="pv" id="pv"></div></div></div>`;
  updatePreview();
}
function renderPrint(){
  const k = KINDS[S.ui.kind];
  const cl = classes();
  if (S.ui.cls !== 'all' && !cl.includes(S.ui.cls)) S.ui.cls = 'all';
  $('#app').innerHTML = `<div class="split"><div class="card"><h2>ព្រីនការងារផ្សេងៗ</h2>
<div class="field"><label for="kindSel">ឯកសារ</label><select id="kindSel" data-ui="kind">${Object.entries(KINDS).map(([id,v])=>`<option value="${id}" ${id===S.ui.kind?'selected':''}>${v.label}</option>`).join('')}</select></div>
${k.byClass?`<div class="field"><label for="clsSel">ថ្នាក់ (ឈ្មោះសិស្សទាញពីបញ្ជីថ្នាក់)</label><select id="clsSel" data-ui="cls"><option value="all" ${S.ui.cls==='all'?'selected':''}>ទាំងអស់ (${cl.length} ថ្នាក់)</option>${cl.map(c=>`<option ${c===S.ui.cls?'selected':''}>${esc(c)}</option>`).join('')}</select></div>`:''}
${(S.ui.kind==='absence'||S.ui.kind==='scores')?`<div class="field"><label for="mlist">ខែ/ជួរ (បំបែកដោយក្បៀស ប្តូរបាន)</label><input type="text" id="mlist" data-mlist="${S.ui.kind}" value="${esc((S.ui.monthsBy&&S.ui.monthsBy[S.ui.kind]!=null)?S.ui.monthsBy[S.ui.kind]:DEF_MONTHS[S.ui.kind])}"><p class="help">ឧ. ១១, ១២, ១, ២ ។ ${S.ui.kind==='absence'?'ជួរ «សរុប» ត្រូវបានបន្ថែមស្វ័យប្រវត្តិ។ ':''}អតិបរមា ១៤។ <button type="button" class="btn sm" data-act="mreset">កំណត់ដើម</button></p></div>`:''}
${k.monthly?`<div class="field"><label for="month">ខែ (ទុកទទេ ដើម្បីសរសេរដោយដៃ)</label><input type="text" id="month" data-ui="month" value="${esc(S.ui.month)}"></div>`:''}
<div class="field"><label for="ttl">ចំណងជើងឯកសារ (កែបាន)</label><input type="text" id="ttl" data-title="${S.ui.kind}" value="${esc(titleOf(S.ui.kind))}"></div>
<div class="inline"><button class="btn pri" data-act="pdf" id="pdfbtn">Save as PDF</button></div>
<p class="help">ចុច «Save as PDF» ដើម្បីរក្សាទុកជាឯកសារ .pdf រួចព្យាយាមព្រីនពី PDF នោះ។</p></div>
<div><div class="pvhead"><h2>មើលជាមុន</h2></div><div class="pv" id="pv"></div></div></div>`;
  updatePreview();
}
const RENDER = {all:renderAll, settings:renderSettings, students:renderStudents, cover:renderCover, inner:renderInner, print:renderPrint};
function show(tab){ S.ui.tab = tab; save(); renderTabs(); RENDER[tab](); renderSyncbar(); document.body.classList.toggle('nodl', !DL); document.querySelectorAll('.nodl-only').forEach(b => b.hidden = !!DL); window.scrollTo({top:0}); }

/* ---------- events ---------- */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'tq'){ tq = t.value; fillTeacherOptions(); return; }
  if (t.dataset.set){ S.s[t.dataset.set] = t.value; save(); if (t.dataset.set === 'sheetUrl'){ const a = $('a[target=_blank]'); if (a) a.href = t.value; } }
  else if (t.dataset.mlist){ S.ui.monthsBy = S.ui.monthsBy || {}; S.ui.monthsBy[t.dataset.mlist] = t.value; save(); updatePreview(); }
  else if (t.dataset.title){ S.ui.titles[t.dataset.title] = t.value; save(); updatePreview(); }
  else if (t.dataset.ui === 'month'){ S.ui.month = t.value; save(); updatePreview(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'zc' || t.id === 'zi' || t.id === 'zp'){ ZSEL[{zc:'cover',zi:'inner',zp:'print'}[t.id]] = t.checked; const b = $('#zbtn'); if (b) b.textContent = 'Save all as ZIP (' + zipJobs(ZSEL).length + ' PDF)'; return; }
  if (t.dataset.actChange === 'teacher') pickTeacher(t.value);
  else if (t.dataset.ui && t.dataset.ui !== 'month'){
    S.ui[t.dataset.ui] = t.value; save();
    if (t.dataset.ui === 'kind') renderPrint(); else if (t.dataset.ui === 'inner') renderInner(); else updatePreview();
  }
  else if (t.id === 'logoFile' && t.files[0]) readLogo(t.files[0]);
  else if (t.id === 'importFile' && t.files[0]) importBackup(t.files[0]);
  else if (t.id === 'csvFile' && t.files[0]) t.files[0].text().then(tx => { $('#paste').value = tx; doImport(tx); });
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'newTeacher') addTeacher();
  else if (e.target.id === 'newClass') addClass();
});
function addTeacher(){
  const el = $('#newTeacher'); const n = el.value.trim(); if (!n) return;
  if (!S.s.teachers.includes(n)) S.s.teachers.push(n);
  pickTeacher(n);
}
function addClass(){
  const el = $('#newClass'); const c = normCls(el.value); if (!c) return;
  if (!S.s.classes.includes(c)) S.s.classes.push(c);
  save(); renderSettings();
}
function readLogo(file){
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const m = 360, sc = Math.min(1, m / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      S.s.logo = c.toDataURL('image/png'); save(); renderSettings(); toast('បានបន្ថែមឡូហ្គោ');
    };
    img.onerror = () => toast('អានរូបភាពមិនបាន');
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function doImport(text){
  const msg = $('#impmsg');
  const r = parseRoster(text, S.ui.target || classes()[0] || '');
  if (!r.total){ msg.className = 'msg err'; msg.textContent = 'រកមិនឃើញឈ្មោះសិស្សទេ។ សូមពិនិត្យទិន្នន័យដែលបិទភ្ជាប់។'; return; }
  const found = Object.keys(r.byClass).filter(Boolean);
  found.forEach(c => { S.students[c] = r.byClass[c]; if (!S.s.classes.includes(c)) S.s.classes.push(c); });
  save();
  const detail = found.map(c => c + ': ' + r.byClass[c].length).join(' · ');
  renderStudents();
  const m2 = $('#impmsg'); m2.className = 'msg'; m2.textContent = 'បាននាំចូល ' + r.total + ' នាក់ (' + detail + ')';
}
function importBackup(file){
  file.text().then(tx => {
    try{
      const p = JSON.parse(tx);
      if (!p || !p.s || !p.students) throw new Error('bad');
      S = {s:{...DEFAULT.s,...p.s}, students:p.students, sheet:{...DEFAULT.sheet,...(p.sheet||{})}, ui:{...DEFAULT.ui,...(p.ui||{}), tab:'settings'}};
      save(); show('settings'); toast('បានស្តារទិន្នន័យ');
    }catch(err){ toast('ឯកសារបម្រុងទុកមិនត្រឹមត្រូវ'); }
  });
}
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'tab') show(b.dataset.tab);
  else if (a === 'tc'){
    const c = b.dataset.c, i = S.s.classes.indexOf(c);
    if (i >= 0) S.s.classes.splice(i, 1); else S.s.classes.push(c);
    save(); renderSettings();
  }
  else if (a === 'sync') syncSheet();
  else if (a === 'pdf') makePdf(b);
  else if (a === 'zip') makeZip(b);
  else if (a === 'mreset'){ if (S.ui.monthsBy) delete S.ui.monthsBy[S.ui.kind]; save(); renderPrint(); }
  else if (a === 'addTeacher') addTeacher();
  else if (a === 'delTeacher'){
    S.s.teachers = S.s.teachers.filter(t => t !== S.s.teacher); S.s.teacher = S.s.teachers[0] || (S.sheet.teachers[0]||{}).name || ''; save(); renderSettings();
  }
  else if (a === 'addClass') addClass();
  else if (a === 'logo') $('#logoFile').click();
  else if (a === 'logoOff'){ S.s.logo = ''; save(); renderSettings(); }
  else if (a === 'csv') $('#csvFile').click();
  else if (a === 'import-paste') doImport($('#paste').value);
  else if (a === 'clr'){ delete S.students[b.dataset.c]; save(); renderStudents(); }
  else if (a === 'export') saveFile('sovphov-radthabal-backup.json', JSON.stringify({s:S.s, students:S.students, sheet:S.sheet, ui:S.ui}));
  else if (a === 'import') $('#importFile').click();
  else if (a === 'dl' || a === 'copy'){
    const r = pagesFor(S.ui.tab);
    if (r.empty || !r.pages.length){ toast('សូមជ្រើសថ្នាក់នៅផ្នែក «ការកំណត់» សិន។'); return; }
    const html = buildDocument(r, document.title);
    if (a === 'copy') copyText(html); else saveFile(r.file, html);
  }
});
window.addEventListener('resize', () => layoutPreview());
if (window.ResizeObserver) new ResizeObserver(() => layoutPreview()).observe(document.body);

renderTabs();
show(S.ui.tab in RENDER ? S.ui.tab : 'settings');
initDownloads().then(() => document.querySelectorAll('.nodl-only').forEach(b => b.hidden = !!DL));
(async () => {
  try{ if (window.claude && window.claude.use) MCP = await window.claude.use('mcp'); }catch(e){ MCP = null; }
  renderSyncbar();
  syncSheet();
})();
</script>

</body>
</html>
